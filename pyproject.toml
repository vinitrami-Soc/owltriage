[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "owltriage"
dynamic = ["version"]
description = "Offline-first, ATT&CK-mapped log triage for blue teams: Linux, web and Windows logs, YAML detection rules, threat feeds, STIX/Navigator export, Wazuh/TheHive/Discord integration."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OwlTriage contributors" }]
keywords = ["blue-team", "soc", "dfir", "threat-hunting", "mitre-attack", "detection-engineering", "wazuh", "thehive", "evtx", "sysmon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "rich>=13.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
evtx = ["evtx>=0.8"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.4", "stix2>=3.0"]

[project.scripts]
owltriage = "owltriage.cli:main"

[project.urls]
Homepage = "https://github.com/vinitrami-Soc/owltriage"
Issues = "https://github.com/vinitrami-Soc/owltriage/issues"

[tool.setuptools.dynamic]
version = { attr = "owltriage.__version__" }

[tool.setuptools.packages.find]
include = ["owltriage*"]

[tool.setuptools.package-data]
owltriage = ["rules/*.yml", "resources/*.yml", "resources/*.json", "resources/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "SIM", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "UP006", "UP007", "UP035", "UP037", "UP045",
          "S101", "S603", "S607", "PLW1510", "PLC0415", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S108", "S311", "S113", "S606"]
