- id: web-cve-2026-110447
  name: KNOWN_EXPLOITED_CVE
  title: CVE-2026-110447 exploit path (Collabora Collabora Online – Built-in CODE Server)
  type: web
  severity: medium
  mitre:
  - T1190
  pattern: /apps/richdocumentscode/proxy\.php|/apps/richdocumentscode_arm64/proxy\.php
  description: 'CISA KEV, added 2026-10-23: Collabora Online – Built-in CODE Server OS Command Injection Vulnerability.
    A request to this endpoint is how the exploit starts. On a server that runs Collabora Collabora Online – Built-in
    CODE Server, check the status code and the source before acting.'
  false_positives:
  - Normal use of Collabora Collabora Online – Built-in CODE Server on servers that run it
  references:
  - https://nvd.nist.gov/vuln/detail/CVE-2026-110447
  - https://github.com/projectdiscovery/nuclei-templates/blob/main/http/cves/2026/CVE-2026-110447.yaml
  author: rule-watch (from a public nuclei template; reviewed in a pull request)
  tests:
    match:
    - /apps/richdocumentscode/proxy.php
    - /apps/richdocumentscode_arm64/proxy.php
    no_match:
    - /apps/richdocumentscode/
