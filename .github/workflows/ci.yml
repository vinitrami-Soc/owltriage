name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,evtx]"
      - name: Lint
        run: ruff check owltriage tests main.py
      - name: Rule self-tests (every YAML rule's match / no_match examples)
        run: owltriage rules test
      - name: Test suite
        run: python -m pytest -q

  real-attack-samples:
    name: regression on EVTX-ATTACK-SAMPLES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,evtx]"
      - name: Fetch real attack recordings
        run: git clone --depth 1 https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES /tmp/evtx-samples
      - name: Known attacks must stay detected; no sample may crash the parser
        run: python -m pytest -q tests/test_real_evtx.py
        env:
          OWLTRIAGE_EVTX_SAMPLES: /tmp/evtx-samples
