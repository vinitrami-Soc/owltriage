name: Bug report
description: Something crashed or behaved wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security vulnerability in owltriage itself? Please follow SECURITY.md instead of opening a public issue."
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: owltriage hunt Security.evtx --window 300
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output / traceback (sanitized)
      render: text
  - type: input
    id: env
    attributes:
      label: owltriage version, Python version, OS
      placeholder: owltriage 2.1.0, Python 3.12, Ubuntu 24.04
    validations:
      required: true
